version: 2

sources:
  - name: tpch_sf100
    catalog: samples
    schema: tpch_sf100
    description: "TPC-H benchmark data at scale factor 100 (~0.1 TB)."
    tables:
      - name: customer
        description: "TPC-H customer table (SF100)."
        columns:
          - name: c_custkey
            description: "Unique customer key."
            data_tests:
              - not_null
              - unique
          - name: c_name
            description: "Customer name."
          - name: c_address
            description: "Customer street address."
          - name: c_nationkey
            description: "Foreign key to nation.n_nationkey."
          - name: c_phone
            description: "Customer phone number."
          - name: c_acctbal
            description: "Account balance."
          - name: c_mktsegment
            description: "Market segment — clustering column."
          - name: c_comment
            description: "Free-text comment."

      - name: orders
        description: "TPC-H orders table (SF100)."
        columns:
          - name: o_orderkey
            description: "Unique order key."
            data_tests:
              - not_null
              - unique
          - name: o_custkey
            description: "Foreign key to customer.c_custkey."
          - name: o_orderstatus
            description: "Order status (F, O, or P)."
          - name: o_totalprice
            description: "Total order price."
          - name: o_orderdate
            description: "Order date — clustering column."
          - name: o_orderpriority
            description: "Order priority (1-URGENT … 5-LOW)."
          - name: o_clerk
            description: "Clerk who placed the order."
          - name: o_shippriority
            description: "Shipping priority."
          - name: o_comment
            description: "Free-text comment."

      - name: lineitem
        description: "TPC-H lineitem table (SF100)."
        columns:
          - name: l_orderkey
            description: "Foreign key to orders.o_orderkey."
          - name: l_partkey
            description: "Foreign key to part.p_partkey."
          - name: l_suppkey
            description: "Foreign key to supplier.s_suppkey."
          - name: l_linenumber
            description: "Line number within the order."
          - name: l_quantity
            description: "Quantity ordered."
          - name: l_extendedprice
            description: "Extended price (quantity × unit price)."
          - name: l_discount
            description: "Discount percentage."
          - name: l_tax
            description: "Tax rate."
          - name: l_returnflag
            description: "Return flag (N, R, or A)."
          - name: l_linestatus
            description: "Line status (O or F)."
          - name: l_shipdate
            description: "Ship date — clustering column."
          - name: l_commitdate
            description: "Commit date."
          - name: l_receiptdate
            description: "Receipt date."
          - name: l_shipinstruct
            description: "Shipping instructions."
          - name: l_shipmode
            description: "Shipping mode (RAIL, TRUCK, AIR, …)."
          - name: l_comment
            description: "Free-text comment."

      - name: nation
        description: "TPC-H nation table (SF100)."
        columns:
          - name: n_nationkey
            description: "Unique nation key."
            data_tests:
              - not_null
              - unique
          - name: n_name
            description: "Nation name."
          - name: n_regionkey
            description: "Foreign key to region.r_regionkey."
          - name: n_comment
            description: "Free-text comment."

      - name: region
        description: "TPC-H region table (SF100)."
        columns:
          - name: r_regionkey
            description: "Unique region key."
            data_tests:
              - not_null
              - unique
          - name: r_name
            description: "Region name."
          - name: r_comment
            description: "Free-text comment."

      - name: supplier
        description: "TPC-H supplier table (SF100)."
        columns:
          - name: s_suppkey
            description: "Unique supplier key."
            data_tests:
              - not_null
              - unique
          - name: s_name
            description: "Supplier name."
          - name: s_address
            description: "Supplier street address."
          - name: s_nationkey
            description: "Foreign key to nation.n_nationkey."
          - name: s_phone
            description: "Supplier phone number."
          - name: s_acctbal
            description: "Account balance."
          - name: s_comment
            description: "Free-text comment."

      - name: part
        description: "TPC-H part table (SF100)."
        columns:
          - name: p_partkey
            description: "Unique part key."
            data_tests:
              - not_null
              - unique
          - name: p_name
            description: "Part name."
          - name: p_mfgr
            description: "Manufacturer."
          - name: p_brand
            description: "Brand."
          - name: p_type
            description: "Part type."
          - name: p_size
            description: "Part size."
          - name: p_container
            description: "Container type."
          - name: p_retailprice
            description: "Retail price."
          - name: p_comment
            description: "Free-text comment."

      - name: partsupp
        description: "TPC-H partsupp table (SF100)."
        columns:
          - name: ps_partkey
            description: "Foreign key to part.p_partkey."
          - name: ps_suppkey
            description: "Foreign key to supplier.s_suppkey."
          - name: ps_availqty
            description: "Available quantity."
          - name: ps_supplycost
            description: "Supply cost."
          - name: ps_comment
            description: "Free-text comment."

